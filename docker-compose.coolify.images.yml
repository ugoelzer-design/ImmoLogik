name: immologik

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-immologik}
      POSTGRES_USER: ${POSTGRES_USER:-immologik}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-immologik} -d ${POSTGRES_DB:-immologik}"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD}; do
        echo 'waiting for minio';
        sleep 2;
      done;
      mc mb -p local/${S3_BUCKET:-immologik-local} || true;
      exit 0;
      "
    restart: "no"

  api:
    image: ghcr.io/ugoelzer-design/immologik-api:${IMAGE_TAG:-master}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: ${API_NODE_ENV:-development}
      API_PORT: 4000
      AUTH_MODE: ${AUTH_MODE:-dev}
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-immologik}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-immologik}?schema=public}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      DOCUMENTS_PUBLIC_API_BASE_URL: ${DOCUMENTS_PUBLIC_API_BASE_URL}
      S3_ENDPOINT: http://minio:9000
      MINIO_PORT: 9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-immologik-local}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      TOKEN_RATE_LIMIT: ${TOKEN_RATE_LIMIT:-20}
      TOKEN_RATE_WINDOW_MS: ${TOKEN_RATE_WINDOW_MS:-60000}

  web:
    image: ghcr.io/ugoelzer-design/immologik-web:${IMAGE_TAG:-master}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: ${WEB_NODE_ENV:-production}
      NEXT_TELEMETRY_DISABLED: 1
      PORT: 3001
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}

  gateway:
    image: ghcr.io/ugoelzer-design/immologik-gateway:${IMAGE_TAG:-master}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      - web
      - api
    environment:
      BASIC_AUTH_USER: ${BASIC_AUTH_USER}
      BASIC_AUTH_HASH: ${BASIC_AUTH_HASH}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "${GATEWAY_PUBLIC_BIND:-127.0.0.1:8080}:8080"

volumes:
  postgres_data:
  minio_data:
  caddy_data:
  caddy_config:
